[project]
name = "klaris-screening"
version = "0.1.0"
description = "Klaris screening loop: collects German tax law changes and matches them against client profiles."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
]

[project.scripts]
screening = "screening.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screening"]

[tool.pytest.ini_options]
testpaths = ["tests"]
