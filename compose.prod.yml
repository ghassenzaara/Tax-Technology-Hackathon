# Production stack on one VM: Caddy (frontend + HTTPS + login), API, Postgres.
# Start: docker compose -f compose.prod.yml up -d --build
# Secrets come from .env next to this file (copy .env.production.example, never commit it).
services:
  caddy:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KLARIS_DOMAIN: ${KLARIS_DOMAIN}
      KLARIS_USER: ${KLARIS_USER}
      KLARIS_PASSWORD_HASH: ${KLARIS_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      REPOSITORY: postgres
      DATABASE_URL: postgresql://klaris:${POSTGRES_PASSWORD}@postgres:5432/klaris
      DATA_DIR: /data
      CORS_ORIGINS: '["https://${KLARIS_DOMAIN}"]'
    volumes:
      - api_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: klaris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: klaris
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klaris -d klaris"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  caddy_data:
  caddy_config:
  api_data:
  pgdata:
